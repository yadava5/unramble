name: Bug
description: Ctrl+G does nothing, the band is missing, setup failed…
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /unramble status
      render: text
  - type: input
    id: version
    attributes:
      label: Claude Code version (claude --version)
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: macOS 26, kitty 0.49
