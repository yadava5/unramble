name: pages

# The install page at https://yadava5.github.io/unramble/ — site/index.html plus the brand assets
# and fonts it names, copied from the repository as they are. No build step, no dependencies.
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "video/public/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp site/index.html _site/
          # IndexNow key: proves to Bing and the other IndexNow engines that pings for this site are ours
          cp site/bfc1f2ef756645e2513f674b2ca5dfa4.txt _site/
          cp assets/logo.svg assets/logo-dark.svg assets/wordmark.svg assets/wordmark-dark.svg \
             assets/demo.gif assets/social-preview.png _site/
          cp video/public/fonts/InstrumentSans-Variable.ttf video/public/fonts/JetBrainsMono-Variable.ttf _site/fonts/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
