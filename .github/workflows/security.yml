name: security

# Runs on every pull request and push. A pull request from a fork gets a read-only token and no
# secrets, and a first-time contributor's run waits for the maintainer to approve it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # weekly: new zizmor audits and advisories land without a commit here

permissions:
  contents: read

jobs:
  guard:
    # Fails on anything that widens what the shipped code can reach: a network host, a process,
    # an engine capability, a dependency or install script, hidden Unicode, an unpinned action.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Guard
        run: node scripts/guard.mjs
      - name: Each guard rule can fail
        run: node --test scripts/guard.test.mjs

  workflows:
    # zizmor audits the workflows themselves: injection, over-broad tokens, cache poisoning.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run zizmor==1.31.1 --offline --format github .github/workflows # zizmor: ignore[adhoc-packages] exact version

  dependencies:
    # Refuses a pull request that adds a dependency with a known vulnerability (the video/
    # tooling has a lockfile; the plugin and installer have no dependencies at all).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
