name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily: Claude Code ships often; a release that moves the plugin API shows up here

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · Claude Code ${{ matrix.claude }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Claude Code the plugin supports, and whatever is newest today. Both must pass:
        # users run the latest release, so a release that breaks the plugin must turn CI red.
        claude: ["2.1.308", latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Claude Code ${{ matrix.claude }}
        # The oldest supported version, or the newest release (read-only token, no secrets).
        # bash on every OS: PowerShell would read ${CLAUDE_VERSION} as its own, unset, variable.
        shell: bash
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_VERSION}" # zizmor: ignore[adhoc-packages]
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
      - name: Validate manifest and hooks
        timeout-minutes: 3
        run: claude plugin validate .
      - name: Plugin tests (engine test host)
        timeout-minutes: 3
        run: claude plugin test .
      - name: Installer and guard tests
        timeout-minutes: 3
        run: node --test "cli/*.test.mjs" "scripts/*.test.mjs"

  install:
    # The real thing on each OS: `npx`-style install from this checkout into a throwaway config
    # folder, the plugin listed by Claude Code, Ctrl+G bound, then uninstall taking it back.
    name: install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UNRAMBLE_MARKETPLACE: ${{ github.workspace }}
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/../claude-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global @anthropic-ai/claude-code@latest # zizmor: ignore[adhoc-packages] what users run; read-only token
      - name: Install
        timeout-minutes: 5
        run: node cli/unramble.mjs install
      - name: Installed and bound
        shell: bash
        run: |
          node cli/unramble.mjs status | tee status.txt
          grep -q 'Plugin:  installed' status.txt
          grep -q 'Ctrl+G:  bound' status.txt
      - name: Uninstall takes it back
        shell: bash
        run: |
          node cli/unramble.mjs uninstall
          node cli/unramble.mjs status | tee status.txt
          grep -q 'Plugin:  not installed' status.txt
          grep -q 'Ctrl+G:  not bound' status.txt
